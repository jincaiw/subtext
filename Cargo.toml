[workspace]
resolver = "2"
members = [
    "crates/subtext-core",
    "crates/subtext-syntax",
    "crates/subtext-theme",
    "crates/subtext-app",
]
default-members = ["crates/subtext-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/local/subtext"
description = "SubText — a cross-platform plain text editor, a faithful reimplementation of CotEditor on GPUI."

[workspace.dependencies]
subtext-core = { path = "crates/subtext-core" }
subtext-syntax = { path = "crates/subtext-syntax" }
subtext-theme = { path = "crates/subtext-theme" }

# UI layer: GPUI Kit bundles GPUI itself plus the component library.
#
# We deliberately do NOT enable GPUI Kit's own `syntect` / `tree-sitter`
# highlighter: SubText highlights with CotEditor's `.cotsyntax` rules (see
# `subtext-syntax`), which is what makes the token colours match CotEditor
# exactly. GPUI Kit supplies the editor widget and the `InputHighlighter`
# seam we plug into.
gpui-kit = { version = "0.7.3", default-features = true }

anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"

encoding_rs = "0.8"
chardetng = "0.1"
regex = "1"
unicode-normalization = "0.1"
# Folder Find grows a displayed line fragment to whole grapheme clusters, which
# is what Foundation's `rangeOfComposedCharacterSequences` does for CotEditor.
unicode-segmentation = "1"
unicode-width = "0.2"
dirs = "6"
clap = { version = "4", features = ["derive"] }

[profile.dev]
debug = "limited"

[profile.release]
strip = "symbols"
lto = "thin"

# GPUI's own build guidance: optimize the heavy render/crunch dependencies even
# in debug builds, so the editor stays usable while developing.
[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
gpui-component = { opt-level = 3 }
resvg = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
ropey = { opt-level = 3 }
regex = { opt-level = 3 }
