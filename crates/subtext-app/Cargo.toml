[package]
name = "subtext-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The SubText desktop application: windows, menus, key bindings and views."

[[bin]]
name = "subtext"
path = "src/main.rs"

[features]
# Off by default: enabling it pulls `gpui-fast-*` into the graph (see below).
ui-tests = ["gpui-kit/test-support"]

[dependencies]
subtext-core.workspace = true
subtext-syntax.workspace = true
subtext-theme.workspace = true

gpui-kit.workspace = true
anyhow.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
env_logger.workspace = true
dirs.workspace = true
clap.workspace = true
# The console stamps each entry with the local time, the way CotEditor does.
jiff.workspace = true

[dev-dependencies]
# `gpui-fast-macos` pins `cocoa = 0.26.0` exactly, while the rest of the graph
# takes 0.26.1. Naming the version here is what lets both resolve to one.
cocoa = "=0.26.0"
# The UI tests build fixtures out of the model types — the encoding list editor
# is handed an `EncodingList` rather than reading one from the settings — and an
# integration test can only name a crate the package itself depends on.
subtext-core.workspace = true
