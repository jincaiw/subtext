[package]
name = "subtext-syntax"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CotEditor .cotsyntax bundle support: parsing, syntax selection and highlighting."

[dependencies]
subtext-core.workspace = true
serde.workspace = true
serde_json.workspace = true
regex.workspace = true

# Tree-sitter, for the outline and for the syntaxes CotEditor highlights from a
# query rather than from `Regex/Highlights.json`.
#
# CotEditor gets the outline of 22 of its 70 syntaxes from a tree-sitter query
# (`queries/<Name>/outline.scm`) rather than from `Regex/Outlines.json`, and
# those bundles carry no regex rules at all — Markdown, Python, JavaScript,
# Rust and the rest. Twenty-one of them also have no highlight rules: their
# colours come from `queries/<Name>/highlights.scm`. Without the grammars both
# lists are empty, so the grammars must stay paired with the queries.
tree-sitter = "0.26"
codebook-tree-sitter-latex = "0.6.1"
tree-sitter-bash = "0.25"
tree-sitter-c = "0.24"
tree-sitter-c-sharp = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-css = "0.25"
tree-sitter-go = "0.25"
tree-sitter-html = "0.23"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-kotlin-sg = "0.4"
tree-sitter-lua = "0.5"
tree-sitter-make = "1"
tree-sitter-md = "0.5"
tree-sitter-php = "0.25"
tree-sitter-python = "0.25"
tree-sitter-ruby = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-scala = "0.26"
tree-sitter-sequel = "0.3"
tree-sitter-swift = "0.7"
tree-sitter-typescript = "0.23"
