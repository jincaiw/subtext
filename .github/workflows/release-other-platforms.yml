name: Release (Linux and Windows)

# A runner is the only place these builds can happen here: the Linux binary
# links against X11/Wayland/xkbcommon, and the Windows one needs MSVC and the
# Windows SDK. The job is manual rather than tag-triggered so a release is
# assembled deliberately — macOS is packaged from the tagged tree by
# `tools/package-macos.sh`, and this adds the other two archives to the same
# release.
#
# It uploads to the release that already exists for `tag`; it does not create
# one. If a job fails, the release simply has no asset for that platform, which
# is the honest state — neither platform has been run here.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the builds to (e.g. v0.4.0)"
        required: true

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The same libraries the local Docker build proved out, plus the runtime
      # ones the linker needs. `libxkbcommon-x11` is what the first attempt
      # was missing.
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libfontconfig1-dev libfreetype6-dev libvulkan1
      - name: Build
        run: cargo build --release --bin subtext -p subtext-app --locked
      - name: Package
        run: tools/package-linux.sh target/release/subtext
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          version="${INPUT_TAG#v}"
          gh release upload "$INPUT_TAG" "dist/SubText-$version-linux-x86_64.tar.gz" --clobber

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --bin subtext -p subtext-app --locked
      - name: Package
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag }}"
          $version = $tag -replace '^v', ''
          $name = "SubText-$version-windows-x86_64"
          $stage = "dist/$name"
          New-Item -ItemType Directory -Force -Path "$stage/resources" | Out-Null
          Copy-Item "target/release/subtext.exe" "$stage/"
          Copy-Item "resources/syntaxes" "$stage/resources/" -Recurse
          Copy-Item "resources/themes" "$stage/resources/" -Recurse
          Copy-Item "resources/queries" "$stage/resources/" -Recurse
          Copy-Item "resources/menu.json" "$stage/resources/"
          Copy-Item "LICENSE", "CHANGELOG.md", "README.md" "$stage/"
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/$name.zip"
      - name: Upload to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ inputs.tag }}"
          $version = $tag -replace '^v', ''
          gh release upload $tag "dist/SubText-$version-windows-x86_64.zip" --clobber
