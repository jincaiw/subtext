name: CI

# The gates the project holds itself to are `cargo test --workspace`, a clean
# clippy, and `cargo fmt --check`; this runs exactly those, on the one platform
# the build has been verified on. Linux and Windows are deliberately absent
# rather than red: GPUI's platform backends have not been exercised here, and a
# workflow that fails on push teaches people to ignore it.
on:
  push:
    branches: [main]
    # Documentation-only pushes do not rebuild the app: the gates are about code,
    # and a green tick per typo fix trains people to ignore the badge.
    paths-ignore: ["docs/**", "*.md", "LICENSE"]
  pull_request:
    paths-ignore: ["docs/**", "*.md", "LICENSE"]

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # `--locked` keeps CI on the versions the lockfile pins, so a released
      # combination is the one that gets tested.
      - name: Format
        run: cargo fmt --all --check
      - name: Test
        run: cargo test --workspace --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # `cargo check` does not link, so a crate's platform branches
      # (`cfg(unix)`, `cfg(target_os = "macos")` and the fallbacks) can be
      # type-checked for Linux and Windows from a Mac runner.
      #
      # Only `subtext-core` is checked, and the reason is what the other two
      # would cost rather than what they would prove:
      #
      # * `subtext-syntax` builds twenty-one tree-sitter parsers from C (see
      #   `ts_outline`), and a build script runs even for `cargo check` — so
      #   checking it for another target needs that target's C compiler, the
      #   same wall `subtext-app` hits. `subtext-theme` depends on it, so it
      #   inherits the wall.
      # * Neither crate has a `cfg(target_os)` of its own, so the only thing
      #   their cross checks could prove is that Rust type-checks — which the
      #   macOS build above already proves.
      #
      # `subtext-core` is where the platform code is, and it has no C in it.
      - name: Install cross targets
        run: rustup target add x86_64-unknown-linux-gnu x86_64-pc-windows-msvc
      - name: Check for Linux
        run: >
          cargo check --locked --target x86_64-unknown-linux-gnu
          -p subtext-core
      - name: Check for Windows
        run: >
          cargo check --locked --target x86_64-pc-windows-msvc
          -p subtext-core
