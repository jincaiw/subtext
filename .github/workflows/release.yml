name: Release

# One workflow owns every release. It runs:
#
#   * when a `vX.Y.Z` tag is pushed (the tag is the source of truth), and
#   * manually. A manual run with no tag bumps the patch component, commits it,
#     tags it, and builds that commit — which is the "every automatic release
#     increments z" rule. A manual run with a tag builds exactly that tag.
#
# Each platform builds, tests and packages on its own runner, then the release
# job collects the artifacts, writes SHA256SUMS and uploads them to a single
# GitHub Release. A failure in one platform fails the run before the release is
# published, so a release never advertises an archive that does not exist.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v0.5.1). Leave empty to bump the patch version and tag it."
        required: false
        type: string
      bump:
        description: "Which component to bump when no tag is given"
        required: false
        default: patch
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Decide the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The full history is what lets the tag push and the notes work.
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Decide the version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF: ${{ github.ref }}
          INPUT_TAG: ${{ inputs.tag }}
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"

          if [ "$EVENT_NAME" = "push" ]; then
            tag="$REF_NAME"
          elif [ -n "${INPUT_TAG:-}" ]; then
            tag="$INPUT_TAG"
          else
            tag=""
          fi

          if [ -n "$tag" ]; then
            case "$tag" in
              v[0-9]*.[0-9]*.[0-9]*) ;;
              *) echo "error: '$tag' is not a vX.Y.Z release tag" >&2; exit 1 ;;
            esac
            version="${tag#v}"
            if [ "$version" != "$cargo_version" ]; then
              echo "error: tag $tag does not match Cargo.toml version $cargo_version" >&2
              exit 1
            fi
          else
            case "$REF" in
              refs/heads/*) branch="${REF#refs/heads/}" ;;
              *) echo "error: an automatic version bump has to run on a branch, not $REF" >&2; exit 1 ;;
            esac
            tools/bump-version.sh "${BUMP:-patch}"
            version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
            tag="v$version"
            git config user.name "SubText Release"
            git config user.email "release@subtext.invalid"
            git add Cargo.toml Cargo.lock
            git commit -m "chore: release $tag"
            git tag "$tag"
            # A tag pushed with GITHUB_TOKEN does not re-trigger workflows, so
            # this run owns the release; that is why the build jobs check out
            # the tag below instead of starting a second run.
            git push origin "HEAD:$branch"
            git push origin "$tag"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  check:
    name: Check (macOS)
    needs: prepare
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Test
        run: cargo test --workspace --locked
      - name: Test (UI)
        run: cargo test -p subtext-app --features ui-tests --test ui --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Third-party notices
        run: python3 tools/generate-notices.py --check

  macos:
    name: macOS (${{ matrix.arch }})
    needs: prepare
    runs-on: macos-14
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: arm64
          - target: x86_64-apple-darwin
            arch: x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      # `dtolnay/rust-toolchain`'s `targets` input installs the target for the
      # toolchain it sets up (stable), but `rust-toolchain.toml` overrides the
      # active toolchain to 1.99.1 inside the checkout — and that is the one
      # cargo builds with. Run without `--toolchain` so rustup resolves the
      # override and adds the target where the build will look for it.
      - name: Install the target for the pinned toolchain
        run: rustup target add "${{ matrix.target }}"
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-${{ matrix.arch }}
      - name: Build, sign, package
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: tools/package-macos.sh --target "${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            dist/SubText-*.zip
            dist/SubText-*.dmg
          if-no-files-found: error

  windows:
    name: Windows (x86_64)
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace --locked
      - name: Build and package
        shell: pwsh
        env:
          # Link the Visual C runtime statically: the portable archive should
          # run on a clean Windows install, without the VC++ Redistributable.
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          cargo build --release --bin subtext --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tools/package-windows.ps1 -NoBuild
      - name: Smoke test the archive
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist/SubText-*-windows-x86_64.zip | Select-Object -First 1
          if (-not $zip) { throw "no Windows archive was produced" }
          Expand-Archive $zip.FullName -DestinationPath dist/smoke
          # A GUI binary cannot print to a console, so this checks the file and
          # its resources rather than starting the UI.
          if (-not (Test-Path dist/smoke/subtext.exe)) { throw "subtext.exe is missing" }
          if (-not (Test-Path dist/smoke/resources/syntaxes)) { throw "syntaxes are missing" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: dist/SubText-*-windows-x86_64.zip
          if-no-files-found: error

  linux:
    name: Linux (x86_64)
    needs: prepare
    runs-on: ubuntu-22.04
    # A Linux binary is linked against the *build host's* glibc, and the
    # archive is then installed on distributions older than the runner. Kylin
    # Desktop V10 — the domestic distribution this job is checked against —
    # ships glibc 2.31 on x86_64, while `ubuntu-22.04` raises the floor to 2.35.
    # The loader then stops the program before `main` with a `version
    # 'GLIBC_2.3x' not found` error, and a launch from the desktop icon shows
    # nothing at all. 20.04 is also 2.31, so build there: the artifact matches
    # the oldest system we claim.
    container:
      image: ubuntu:20.04
    # A container job's default shell is `sh`, and these steps use bash:
    # `set -o pipefail` is not an `sh` option, and the check below needs it.
    defaults:
      run:
        shell: bash
    steps:
      # A `container:` job starts from the bare image, and `actions/checkout`
      # needs `git` inside it. The tooling therefore has to be installed before
      # the checkout step, not after it.
      - name: Prepare the container
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git tar gzip xz-utils zstd python3 file \
            pkg-config build-essential \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libfontconfig1-dev libfreetype6-dev libvulkan1 \
            libegl1 rpm
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # The base image belongs in the key: object files built against
          # 22.04's glibc would otherwise be restored into this 20.04 build and
          # quietly raise the symbol floor again.
          key: glibc-2.31
      - name: Test
        run: cargo test --workspace --locked
      - name: Build
        run: cargo build --release --bin subtext -p subtext-app --locked
      - name: Check the glibc floor
        run: |
          set -euo pipefail
          # The highest versioned glibc symbol is the oldest glibc that can
          # load this binary. Above 2.31 it will not start on Kylin Desktop
          # V10, which is what the 20.04 container exists to prevent.
          highest="$(objdump -T target/release/subtext \
            | grep -o 'GLIBC_[0-9][0-9.]*' | sort -uV | tail -1)"
          test -n "$highest"
          echo "highest glibc symbol: $highest"
          if [ "$(printf '%s\n2.31\n' "$highest" | sort -V | tail -1)" != "2.31" ]; then
            echo "error: the binary needs $highest but Kylin V10 has glibc 2.31" >&2
            exit 1
          fi
      - name: Fetch appimagetool
        run: |
          curl -fsSL --retry 3 -o /usr/local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /usr/local/bin/appimagetool
      - name: Package
        env:
          APPIMAGETOOL: /usr/local/bin/appimagetool
        run: tools/package-linux.sh target/release/subtext --strict
      - name: Check the packages
        run: |
          set -euo pipefail
          for file in dist/*.tar.gz dist/*.deb dist/*.rpm dist/*.AppImage; do
            test -s "$file"
          done
          dpkg-deb --info dist/SubText-*.deb | sed -n '1,20p'
          rpm -qip dist/SubText-*.rpm | sed -n '1,20p'
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: |
            dist/SubText-*-linux-x86_64.tar.gz
            dist/SubText-*-linux-x86_64.deb
            dist/SubText-*-linux-x86_64.rpm
            dist/SubText-*-linux-x86_64.AppImage
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [prepare, check, macos, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Write SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.zip *.dmg *.tar.gz *.deb *.rpm *.AppImage > SHA256SUMS
          cat SHA256SUMS
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "SubText $VERSION" \
              --generate-notes \
              --notes "Installers and archives for macOS (arm64 and Intel), Windows (x64) and Linux (x86_64). See README.md for install instructions and known limitations."
          fi
          gh release upload "$TAG" dist/* --clobber
